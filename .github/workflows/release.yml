name: Release APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        run: scripts/app-version.sh >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the signed release APK
        run: >
          ./gradlew assembleRelease
          -PversionName="$VERSION_NAME"
          -PversionCode="$VERSION_CODE"

      - name: Name the APK after the version
        run: cp app/build/outputs/apk/release/app-release.apk "StreamMusic-v$VERSION_NAME.apk"

      - name: Tag the commit
        run: |
          git tag "v$VERSION_NAME"
          git push origin "v$VERSION_NAME"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          files: StreamMusic-v${{ env.VERSION_NAME }}.apk
          generate_release_notes: true
