name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the signed release APK
        run: >
          ./gradlew assembleRelease
          -PversionName="${GITHUB_REF_NAME#v}"
          -PversionCode="${{ github.run_number }}"

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "StreamMusic-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: StreamMusic-${{ github.ref_name }}.apk
          generate_release_notes: true
